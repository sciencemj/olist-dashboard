[project]
name = "olist-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sciencemj", email = "sciencemj.park@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "duckdb-engine>=0.17.0",
    "ipykernel>=7.3.0",
    "jupysql>=0.11.1",
    "pandas>=3.0.5",
    "toml>=0.10.2",
]

[project.scripts]
olist-dashboard = "olist_dashboard:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
