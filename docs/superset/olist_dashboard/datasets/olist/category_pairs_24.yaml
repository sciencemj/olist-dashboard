sql: "WITH oc AS (\n    SELECT DISTINCT order_id, product_category AS cat\n    FROM\
  \ mart_order_items\n    WHERE product_category IS NOT NULL\n      AND product_category\
  \ <> 'unknown'\n),\nmulti AS (\n    SELECT oc.order_id, oc.cat\n    FROM oc\n  \
  \  JOIN (\n        SELECT order_id FROM oc GROUP BY order_id HAVING COUNT(*) > 1\n\
  \    ) m ON m.order_id = oc.order_id\n),\ncat_n AS (\n    SELECT cat, COUNT(*) AS\
  \ c FROM multi GROUP BY cat\n),\ntotal AS (\n    SELECT COUNT(DISTINCT order_id)\
  \ AS n FROM multi\n)\nSELECT\n    a.cat                                        AS\
  \ category_a,\n    b.cat                                        AS category_b,\n\
  \    COUNT(*)                                     AS pair_orders,\n    ROUND(COUNT(*)\
  \ * t.n / (ca.c * cb.c), 2)     AS lift\nFROM multi a\nJOIN multi b  ON b.order_id\
  \ = a.order_id AND b.cat <> a.cat\nJOIN cat_n ca ON ca.cat = a.cat\nJOIN cat_n cb\
  \ ON cb.cat = b.cat\nCROSS JOIN total t\nGROUP BY a.cat, b.cat, ca.c, cb.c, t.n\n\
  HAVING COUNT(*) >= 5\n"
